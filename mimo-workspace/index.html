<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiMo 智能助手 - 示例页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 25px 0;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-orange {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: #333;
        }
        
        #output {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            min-height: 80px;
            border-left: 5px solid #667eea;
            text-align: left;
        }
        
        #output h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .counter-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .counter-btn:hover {
            background: #667eea;
            color: white;
        }
        
        #count {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            min-width: 80px;
        }
        
        footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>MiMo 智能助手</h1>
        <p class="subtitle">欢迎使用！这是一个可交互的 HTML 示例页面</p>
        
        <div class="btn-group">
            <button class="btn" onclick="showTime()">⏰ 显示时间</button>
            <button class="btn btn-green" onclick="changeBg()">🎨 换背景</button>
            <button class="btn btn-orange" onclick="greet()">👋 打招呼</button>
        </div>
        
        <h3 style="color: #667eea; margin-bottom: 10px;">计数器</h3>
        <div class="counter">
            <button class="counter-btn" onclick="decrement()">-</button>
            <span id="count">0</span>
            <button class="counter-btn" onclick="increment()">+</button>
        </div>
        
        <div id="output">
            <h3>📢 输出区域</h3>
            <p>点击上面的按钮来查看效果！</p>
        </div>
        
        <footer>
            <p>✨ 由 MiMo 智能助手创建 | 2025</p>
        </footer>
    </div>

    <script>
        let count = 0;
        const gradients = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
            'linear-gradient(135deg, #ee0979 0%, #ff6a00 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)'
        ];
        
        function showTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN');
            const date = now.toLocaleDateString('zh-CN', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
            document.getElementById('output').innerHTML = `
                <h3>⏰ 当前时间</h3>
                <p>📅 ${date}</p>
                <p>🕐 ${time}</p>
            `;
        }
        
        function changeBg() {
            const randomIndex = Math.floor(Math.random() * gradients.length);
            document.body.style.background = gradients[randomIndex];
            document.getElementById('output').innerHTML = `
                <h3>🎨 背景已更换</h3>
                <p>页面背景已更新为新的渐变色！</p>
            `;
        }
        
        function greet() {
            const hour = new Date().getHours();
            let greeting = '';
            if (hour < 6) greeting = '🌙 夜深了，注意休息！';
            else if (hour < 12) greeting = '🌅 早上好！新的一天开始了！';
            else if (hour < 18) greeting = '☀️ 下午好！继续加油！';
            else greeting = '🌆 晚上好！辛苦了！';
            
            document.getElementById('output').innerHTML = `
                <h3>👋 问候</h3>
                <p>${greeting}</p>
                <p>感谢你使用 MiMo 智能助手！</p>
            `;
        }
        
        function increment() {
            count++;
            document.getElementById('count').textContent = count;
        }
        
        function decrement() {
            count--;
            document.getElementById('count').textContent = count;
        }
    </script>
</body>
</html>
